repos:
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
  - repo: https://github.com/timothycrosley/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        # language_version: python3.11
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        exclude: /tests/
        # mypy options live in pyproject.toml [tool.mypy] so `mypy stac_validator/`
        # (as run in CI) and this hook use identical settings
        additional_dependencies: ["types-attrs", "types-requests", "types-PyYAML", "types-jsonschema", "types-tqdm"]
